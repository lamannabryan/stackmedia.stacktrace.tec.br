<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3ede8" />
  <title></title>
  <script src="/js/theme.js"></script>
  <link rel="manifest" href="/manifest.json?v=3" />
  <link rel="icon" href="/pwa-icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/users.css" />
  <link rel="stylesheet" href="/theme.css" />
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <img class="site-brand-logo" src="/branding/stackmedia-wordmark.svg" width="288" height="40" alt="_stackmedia" />
      <p class="users-eyebrow">Sua próxima campanha começa aqui</p>
      <h1><span>Produtos em Destaque</span><br /><span>Ideias em Movimento</span></h1>
      <p>Crie ofertas para Stories, Feed e TV Indoor com seu catálogo em um só lugar.</p>
      <div class="login-formats"><span>Stories</span><span>Feed</span><span>TV Indoor</span></div>
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <p class="users-eyebrow">Bem-vindo de volta</p>
      <h2 id="login-title">Entre na sua conta</h2>
      <form id="login-form">
        <label>E-mail<input name="email" type="email" autocomplete="username" maxlength="254" required /></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="128" required /></label>
        <div class="login-options">
          <label class="users-check"><input id="show-password" type="checkbox" /> Mostrar senha</label>
          <button class="login-forgot" type="button" aria-disabled="true" title="Em breve">Esqueci minha senha</button>
        </div>
        <button class="users-primary" type="submit">Entrar</button>
        <div class="login-divider" aria-hidden="true"><span>ou</span></div>
        <button class="login-google" type="button" aria-disabled="true" title="Em breve">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.07a10 10 0 0 0 0 9.02l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.59A5.99 5.99 0 0 1 12 5.96Z"/></svg>
          Entrar com Google
        </button>
        <p id="login-status" class="users-feedback" role="status" aria-live="polite"></p>
      </form>
      <noscript>Ative o JavaScript para entrar na aplicação.</noscript>
    </section>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
